# 로컬 개발 override. compose.yaml이 띄운 Postgres/Redis에 접속한다.
# 로컬 전용 값만 두고, 실제 비밀번호·토큰은 넣지 않는다(configuration.md).
spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/pinlog
    username: pinlog
    password: pinlog-local
  data:
    redis:
      host: localhost
      port: 16379

# 인증 스텁(back#28 계약). 인증 PR이 오면 이 프로퍼티와 X-Debug-Member-Id 분기를 반드시 제거한다.
pinlog:
  auth:
    stub:
      enabled: true
