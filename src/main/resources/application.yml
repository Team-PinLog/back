server:
  port: 8080
  # Traefik 뒤에서 동작하므로 X-Forwarded-* 를 신뢰해야 한다.
  # 이게 없으면 OAuth redirect_uri가 파드 내부 주소(http://10.x:8080/...)로 만들어져
  # 공급자 콘솔에 등록한 공개 주소와 달라지고 redirect_uri_mismatch가 난다.
  forward-headers-strategy: framework
  # SIGTERM을 받으면 새 요청을 막고 진행 중인 요청을 끝낸 뒤 종료한다.
  # 이게 없으면 RollingUpdate 중 처리 중이던 요청이 잘린다.
  shutdown: graceful
  servlet:
    context-path: /api/core

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  # 로컬 .env를 프로퍼티로 올린다. Spring Boot는 .env를 자동으로 읽지 않아서,
  # 이게 없으면 소셜 로그인 자격증명이 애플리케이션에 전달되지 않는다(compose만 읽는다).
  # optional: 이므로 .env가 없는 CI·운영 컨테이너에서도 기동이 깨지지 않는다.
  # [.properties]는 확장자 없는 파일을 properties 형식으로 읽으라는 지시다.
  config:
    import: optional:file:.env[.properties]
  application:
    name: pinlog-back
  lifecycle:
    # Kubernetes terminationGracePeriodSeconds와 짝을 이루는 값이다.
    # preStop sleep(5s) + 이 값(20s) < terminationGracePeriodSeconds(40s)를 지켜야
    # 배수 도중 SIGKILL로 잘리지 않는다. 매니페스트 쪽은 Infra 소유(S15P11A705-47).
    timeout-per-shutdown-phase: 20s
  security:
    oauth2:
      client:
        registration:
          google:
            # 자격증명은 .env(로컬)·Kubernetes Secret(운영)에서 주입한다.
            # 기본값 unset은 자격증명 없이도 컨텍스트가 뜨게 하려는 것이다. 인가 요청 URL을
            # 만드는 데는 문자열만 필요해서, CI가 실제 키 없이 리다이렉트를 검증할 수 있다.
            client-id: ${GOOGLE_CLIENT_ID:unset}
            client-secret: ${GOOGLE_CLIENT_SECRET:unset}
            # openid가 있어야 고유 식별자 sub를 받는다. profile은 저장할 곳이 없어 제외한다.
            scope: openid,email
            # {baseUrl}은 context-path(/api/core)까지 포함한다.
            # registrationId가 마지막이 아니어도 된다 — 콜백은 state에서 값을 꺼내기 때문이다.
            redirect-uri: "{baseUrl}/v1/auth/{registrationId}/callback"
          kakao:
            client-id: ${KAKAO_CLIENT_ID:unset}
            client-secret: ${KAKAO_CLIENT_SECRET:unset}
            # Kakao는 client_secret을 헤더가 아니라 본문으로 받는다. 기본값(basic)이면 401이다.
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            # account_email은 콘솔에서 동의 항목을 켜야 내려온다. 선택 동의라 없을 수 있다.
            scope: account_email
            redirect-uri: "{baseUrl}/v1/auth/{registrationId}/callback"
          naver:
            client-id: ${NAVER_CLIENT_ID:unset}
            client-secret: ${NAVER_CLIENT_SECRET:unset}
            authorization-grant-type: authorization_code
            # 위 Kakao의 scope와 무게가 다르다. Kakao는 콘솔 동의항목과 어긋나면 인가 요청이
            # KOE205로 거절되는 실동작 항목이지만, Naver는 제공 항목을 콘솔의 「제공 정보 선택」이
            # 정한다. 이 값은 인가 URL에 실려 나가되 공급자가 무엇을 내려줄지는 바꾸지 않는 것으로
            # 보인다 — 콘솔에서 이메일을 켠 상태로만 검증했으므로 둘을 갈라 확인하지는 못했다.
            # 의도(이메일을 받는다)를 남기는 값으로 두고, 실제 결정자는 콘솔임을 여기 적어 둔다.
            scope: email
            redirect-uri: "{baseUrl}/v1/auth/{registrationId}/callback"
        # Kakao·Naver는 Spring의 CommonOAuth2Provider에 없어 엔드포인트를 직접 적는다
        # (google·github·facebook·okta만 내장이다).
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            # 식별자가 최상위 id다. 이 키가 틀리면 Spring이 사용자 생성에서 먼저 죽는다.
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            # 본문이 response로 한 겹 감싸여 있어 최상위에 식별자가 없다. 감싼 키를 지목한다.
            user-name-attribute: response
  data:
    redis:
      # Lettuce 기본값은 60초다. 그 값이면 Redis가 멎었을 때 요청 스레드가 1분간 붙잡힌다 —
      # 탈퇴는 커밋 이후 폐기가 요청 스레드에서 돌아(MemberWithdrawalService) 204 응답이 그만큼
      # 늦고, 로그인·재발급도 같은 값에 걸린다. Redis는 캐시·세션 전용이라 오래 기다려 얻을 것이
      # 없으므로 짧게 끊고 실패로 처리한다.
      timeout: 2s
      connect-timeout: 1s
  jpa:
    hibernate:
      ddl-auto: validate
    # 기본값 true는 서비스 계층 밖(컨트롤러·직렬화 시점)까지 영속성 컨텍스트를 열어 둔다.
    # 그러면 DTO로 변환하기 전에 지연 로딩이 일어나 N+1이 조용히 생긴다. 트랜잭션 경계는
    # service가 갖는다는 계층 규칙(package-structure.md)과도 맞지 않으므로 끈다.
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # schemas 미지정: 스키마 생성은 V1이 전담하고, flyway_schema_history는 public에 둔다.
    # (schemas를 지정하면 Flyway가 스키마 자동생성을 시도해 V1과 역할이 충돌하고
    #  이력 테이블이 core 스키마에 섞인다.)
    #
    # 버전 구간 소유(백엔드 V2~V99 / AI V100~V199)에서 AI 구간이 위에 있으므로, 백엔드가 추가하는
    # 번호는 이미 적용된 최대 버전(102)보다 항상 낮다. 기본값(false)이면 Flyway가 이를 거부해
    # 기존 DB에서 기동이 실패한다(BT-02). 구간 구조를 유지하기로 했으므로 out-of-order를 허용한다.
    # 감수하는 것: 적용 순서가 환경마다 달라진다(빈 DB는 V2→V100, 기존 DB는 V100→V2). 근거는 BD-26.
    out-of-order: true

pinlog:
  auth:
    # 로그인·실패 후 브라우저를 돌려보낼 클라이언트 경로(API 명세 3.2).
    # 요청 파라미터로 받지 않는다 — 임의 URL을 받으면 open redirect가 된다.
    # 프론트와 같은 오리진이라 절대 경로면 충분하다.
    client-redirect-uri: ${AUTH_CLIENT_REDIRECT_URI:/auth/callback}
    jwt:
      # RS256 개인키(PKCS#8 PEM). 운영은 Kubernetes Secret으로 주입한다(BD-29).
      # 비어 있으면 로컬·테스트는 임시 키쌍을 만들고, 운영 프로파일은 기동에 실패한다 —
      # 파드마다 서명 키가 달라지면 재시작·스케일아웃 때 전면 로그아웃이 되기 때문이다.
      private-key: ${JWT_PRIVATE_KEY:}
      # 수명의 원본은 BD-21이다. 여기서 임의로 바꾸지 않는다.
      access-token-ttl: 30m
      refresh-token-ttl: 7d
      # 탈퇴 인가 왕복을 시작할 권한의 수명(BD-48). 사용자가 공급자 화면을 거치는 동안만
      # 유효하면 된다. 값의 근거는 민감 작업 전 재인증에 최근성 창을 두는 업계 관행이다.
      withdrawal-ticket-ttl: 5m
      issuer: pinlog
  # FastAPI AI Server 연동. 정본은 AI 파트가 소유한 docs/ai/spec/ai-integration.md 2.1이다.
  ai:
    base-url: ${PINLOG_AI_BASE_URL:http://localhost:8000}
    # 서비스 간 공유 시크릿. 저장소가 public이므로 실제 값을 파일에 적지 않는다.
    # 헤더 이름(X-Internal-Secret)의 원본은 ai 레포 app/core/security.py다.
    internal-secret: ${PINLOG_AI_INTERNAL_SECRET:}
    # 검색 요청에 실어 보내는 Embedding Profile. 비밀값이 아니라 공용 계약 05 §7.1 표에 공개된
    # 값이므로 리터럴을 파일에 둔다 — 그래야 Profile 교체가 PR·리뷰·git 이력을 거친다. 환경변수는
    # 실험·롤백용 덮어쓰기이며 필수가 아니다. 값이 FastAPI 설정과 다르면 검색이 422로 거절되고
    # 빈 결과로 치환되지 않는다(런타임 대조). 근거는 BD-39.
    embedding-profile: ${PINLOG_AI_EMBEDDING_PROFILE:openai-text-embedding-3-small-1536-cosine-v1}
    process:
      # 202 접수 확인만 받으므로 짧다. 초과해도 PENDING이 남아 재스캔이 복구하므로,
      # 여기서 오래 기다리는 것은 사용자 요청 스레드를 붙잡아 두는 손해뿐이다.
      connect-timeout: 1s
      read-timeout: 3s
    search:
      # process보다 길다. 질의 임베딩 생성과 벡터 검색이 응답 경로 안에 있다. 초과하면 재시도 없이
      # 즉시 오류 응답으로 바꾼다 — 사용자 요청 경로라 기다릴수록 손해고, 재시도는 장애 시
      # 스레드 점유만 늘린다(AI 파트 소유 명세 docs/ai/spec/ai-integration.md 3장).
      connect-timeout: 1s
      read-timeout: 5s
    place-suggestion:
      connect-timeout: 1s
      read-timeout: 35s
      max-concurrent-requests: 1
    # 유실·정지된 AI 처리를 복구하는 재스캔과 FAILED Finalizer. 정본은 AI 파트가 소유한
    # docs/ai/spec/ai-rescan-scheduler.md 2장이며 여기서 임의로 바꾸지 않는다. 상수로 박지 않는
    # 이유는 튜닝 대상인 것도 있지만, 무엇보다 "만료됐다"를 테스트에서 만들 수 없기 때문이다.
    rescan:
      # ISO-8601이다. 다른 Duration 값들처럼 5m으로 적을 수 없다 — 이 값만은 Boot의 완화된 바인딩이
      # 아니라 @Scheduled(fixedDelayString)이 직접 파싱하고, 그쪽은 숫자(밀리초)나 ISO-8601만 받는다.
      # 5m으로 두면 NumberFormatException으로 기동이 실패한다.
      interval: PT5M
      # 이 시간을 넘긴 PENDING은 요청이 유실된 것으로 본다(큐 포화·호출 실패·프로세스 종료).
      pending-expiry: 5m
      # PENDING보다 길다. 실제로 처리 중일 가능성을 고려한 값이며, 10분은 Embedding + LLM 판정의
      # 정상 소요를 크게 웃돈다. 이 시간을 넘긴 PROCESSING은 워커 프로세스 종료로 유실된 것이다.
      processing-expiry: 10m
      # 정본은 DB의 CHECK (retry_count BETWEEN 0 AND 3)이다(V100__ai_tables.sql). 이 값만 올리면
      # 증가 UPDATE가 제약 위반으로 실패한다. Backoff는 두지 않는다 — 주기 5분이 그 자체로 최소
      # 간격이고, 3회뿐이라 지수 backoff의 이득이 없다.
      max-retry: 3
      # 재스캔과 Finalizer가 각각 한 회차에 집는 상한. 후보 건수가 계속 이 값에 붙어 있으면
      # FastAPI가 처리량을 못 따라가고 있다는 신호다(명세 8장).
      batch-size: 100
  # 문자열 검색 병합(P49 §4·§5, 병합 규칙의 실측 근거는 ai 레포 I54). 검증 게이트(P49 §7) 통과
  # 전에는 켜지 않는다 — 기본값 false가 곧 "현행과 동일한 검색"이다.
  search:
    lexical:
      enabled: ${PINLOG_SEARCH_LEXICAL_ENABLED:false}
      # 단어형 질의의 최대 글자 수. ai 레포 SEARCH_WORD_QUERY_MAX_CHARS와 같은 값·같은 의미여야
      # 한다 — 어긋나면 「단어형」의 정의가 파트마다 달라져 게이트(단어형 한정)가 절반만 켜진다.
      word-query-max-chars: ${PINLOG_SEARCH_LEXICAL_WORD_QUERY_MAX_CHARS:5}
    # 결합 신뢰도 게이트(S15P11A705-400, BD-52). 벡터 신호 하나뿐이고 유사도가 낮은 결과를
    # 응답에서 뺀다. 기본값 false가 곧 "현행과 동일한 검색"이다.
    gate:
      enabled: ${PINLOG_SEARCH_GATE_ENABLED:false}
      # ai 레포 오프라인 재측정 채택값(S15P11A705-401,
      # docs/implements/2026-08-07-gate-threshold-remeasure.md).
      similarity-threshold: ${PINLOG_SEARCH_GATE_SIMILARITY_THRESHOLD:0.35}
  # Feed 추천 정책값. 정본은 AI 파트가 소유한 docs/ai/spec/feed-scoring.md이며 여기서 임의로
  # 바꾸지 않는다. 상수로 박지 않고 설정으로 두는 이유는 튜닝 대상이기 때문이다 — 재배포 없이
  # 조정할 수 있어야 하고, 가중치를 바꿔도 순위가 안 바뀌는 회귀를 테스트가 잡을 수 있어야 한다.
  feed:
    candidate:
      # 세 채널의 합(100+80+20)이 pool-size와 같아 현재 배분에서 잘라내기는 발동하지 않는다.
      # 배분 합을 올릴 때를 대비한 방어선으로 남겨 둔 값이다.
      pool-size: 200
      # 60 → 100. P42에서 Place region 항이 빠지면서 AI 미완료 Collection이 점수를 얻던 경로가
      # 사라진 데 대한 부분적 보상이다. 후보 진입 기회만 넓힐 뿐 점수 열세는 해소하지 않는다.
      recent-limit: 100
      follow-limit: 80
      random-limit: 20
    scoring:
      # 합이 1.0이다. 합이 달라져도 상대 순서는 같지만 점수 절대값의 해석이 어려워진다.
      w-follow: 0.500
      w-keyword: 0.375
      w-recency: 0.125
      # 최대 감점은 0.05 * 5 = 0.25. 상위 항목을 뒤로 밀 정도는 되지만 완전히 배제하지는 않는다.
      impression-penalty: 0.05
      impression-cap: 5
      impression-window: 7d
      recency-half-life-days: 14
    diversity:
      max-per-owner: 2
      # 탐색 비중 20%. 슬롯 수는 page-size에 비례하며 비율이 정책이다.
      exploration-slots: 4
      page-size: 20
    cold-start:
      threshold: 3
      w-follow: 0.500
      # keywordAffinity를 계산하지 않는다. 입력이 없어 모든 후보가 같은 점수를 받는다.
      w-keyword: 0.000
      w-recency: 0.500
      # 취향을 모르는 상태이므로 탐색 가치가 크다. 일반 20%보다 높은 30%.
      exploration-slots: 6

build:
  sha: ${BUILD_SHA:unknown}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # readiness에 db를 넣어 DB 장애 시 Pod가 트래픽에서 빠지게 한다. 이게 없으면 구성원이
        # readinessState 하나뿐이라 DB가 죽어도 Ready로 남아 요청이 500으로 실패한다.
        # readinessState를 함께 적어야 한다 — include는 기본 구성원을 대체하므로 db만 적으면
        # 기동 완료 전에도 readiness가 UP이 된다.
        #
        # redis는 넣지 않는다. Redis 장애를 Pod unready로 번지게 할지는 장애 시 서비스 동작
        # 계약이 정해진 뒤 판단한다(back#65). liveness는 기본값을 유지한다 — 외부 의존성을
        # 넣으면 DB 순단이 Pod 재시작으로 번진다. 인프라와 합의한 정책이며 근거는 BD-28.
        readiness:
          include: readinessState,db
