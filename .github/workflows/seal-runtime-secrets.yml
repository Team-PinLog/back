name: Seal backend runtime secrets

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  seal-runtime-secrets:
    name: Seal backend runtime secrets
    runs-on: ubuntu-latest
    environment: pinlog-secrets-prod
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Diagnose OIDC endpoint metadata safely
        shell: bash
        run: |
          python3 - <<'PYSAFE'
          import os
          from urllib.parse import urlparse
          parsed = urlparse(os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL", ""))
          print(f"oidc_scheme={parsed.scheme or 'missing'}")
          print(f"oidc_host={parsed.hostname or 'missing'}")
          print(f"oidc_request_token_present={bool(os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN'))}")
          import base64, json, urllib.parse, urllib.request
          query = urllib.parse.parse_qsl(parsed.query, keep_blank_values=True)
          query.append(("audience", "pinlog-sealedsecret-infra-pr"))
          url = urllib.parse.urlunparse(parsed._replace(query=urllib.parse.urlencode(query)))
          request = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"})
          with urllib.request.urlopen(request, timeout=30) as response:
              jwt = json.load(response)["value"]
          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("aud", "sub", "repository", "sha", "ref", "workflow_ref", "run_id"):
              print(f"oidc_claim_{key}={claims.get(key, 'missing')}")
          PYSAFE
      - name: Create canonical Infra SealedSecret Draft PR
        uses: Team-PinLog/infra/.github/actions/sealedsecret-infra-pr@786a40f329365df58f4167b90feb332ea80caa67
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          PINLOG_AI_INTERNAL_SECRET: ${{ secrets.PINLOG_AI_INTERNAL_SECRET }}
          PINLOG_INFRA_SECRET_PR_TOKEN: ${{ secrets.PINLOG_INFRA_SECRET_PR_TOKEN }}
        with:
          policy: back-prod
          revision: ${{ github.sha }}
