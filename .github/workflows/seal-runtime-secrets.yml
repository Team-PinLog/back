name: Seal backend runtime secrets

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  seal-runtime-secrets:
    name: Seal backend runtime secrets
    runs-on: ubuntu-latest
    environment: pinlog-secrets-prod
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create canonical Infra SealedSecret Draft PR
        uses: Team-PinLog/infra/.github/actions/sealedsecret-infra-pr@9e3b3c98fdaa83c78ad31b6f9e3a4894249ca238
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          PINLOG_AI_INTERNAL_SECRET: ${{ secrets.PINLOG_AI_INTERNAL_SECRET }}
          PINLOG_INFRA_SECRET_PR_TOKEN: ${{ secrets.PINLOG_INFRA_SECRET_PR_TOKEN }}
        with:
          policy: back-prod
          revision: ${{ github.sha }}
