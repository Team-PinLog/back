name: backend-ci

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: backend-ci / check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # 아래 마이그레이션 불변성 검사가 base와 diff를 떠야 해서 전체 히스토리가 필요하다
          fetch-depth: 0
      # 빌드 결과에 닿을 수 없는 변경(문서)만 있는 PR을 가려낸다. 이 잡은 dev의 필수 상태 검사라
      # 워크플로 수준 paths-ignore로 건너뛰면 검사가 대기 상태로 남아 머지가 막힌다. 그래서 잡은
      # 항상 돌고, 무거운 스텝만 이 출력으로 끈다.
      - name: Detect documentation-only changes
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          merge_base=$(git merge-base "$BASE_SHA" HEAD)
          changed=$(git diff --name-only "$merge_base" HEAD)
          # 판정은 "무엇이 문서인가"가 아니라 "빌드에 닿는 것이 하나도 없는가"로 한다. 새로운 종류의
          # 파일이 들어와도 기본값이 "전체 실행"이라 안전한 쪽으로 틀린다.
          build_affecting=$(printf '%s\n' "$changed" | grep -vE '(\.md$|^docs/)' || true)
          if [ -n "$changed" ] && [ -z "$build_affecting" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "문서만 변경됨 — 검사와 이미지 빌드를 건너뜁니다."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
          printf '%s\n' "$changed"
      # 이미 병합된 Flyway 마이그레이션의 수정을 막는다.
      # 빈 DB에 적용해보는 FlywayMigrationTests는 "내용이 바뀐" 것을 잡지 못한다
      # (바뀐 내용이 그대로 적용될 뿐이다). 그래서 이 검사가 따로 필요하다.
      # 근거: docs/development/database-conventions.md
      - name: Verify applied migrations were not modified
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # base.sha는 대상 브랜치(dev)의 "현재 팁"이라 계속 움직인다. 그것과 직접 diff하면
          # 이 PR이 바꾼 것뿐 아니라 "dev에는 있는데 이 브랜치에는 없는 것"까지 잡히고,
          # 그건 삭제(D)로 보인다 — 즉 남이 dev에 넣은 마이그레이션 때문에 정상 PR이 막힌다.
          # 분기점(merge-base)과 비교하면 이 PR이 실제로 건드린 것만 남는다.
          merge_base=$(git merge-base "$BASE_SHA" HEAD)
          violations=$(git diff --diff-filter=MDR --name-only "$merge_base" HEAD \
            -- src/main/resources/db/migration \
            | grep -E '/V[0-9]+__.*\.sql$' || true)
          if [ -n "$violations" ]; then
            echo "$violations" | while read -r f; do
              echo "::error file=$f::이미 병합된 마이그레이션입니다. 수정·삭제·이름변경 대신 자기 소유 구간(백엔드 V2~V99, AI V100~V199)의 다음 번호로 새 마이그레이션을 추가하세요."
            done
            echo "적용된 마이그레이션을 바꾸면 Flyway 체크섬이 어긋나 배포가 깨집니다."
            exit 1
          fi
          echo "OK — 기존 마이그레이션 수정 없음"
      # wrapper 검증은 gradle-wrapper.jar가 바뀌지 않았는지 보는 보안 게이트다. 비용이 없으므로
      # 문서 전용 변경에서도 끄지 않는다.
      - uses: gradle/actions/wrapper-validation@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
      # clean은 넣지 않는다. 러너는 매번 새로 뜨므로 build/에 지울 것이 없고, Gradle이 스스로 판단할
      # 최신 여부만 버린다.
      #
      # bootJar를 같은 호출에 넣는다. 이미지 빌드가 쓸 jar를 여기서 만들어 컨테이너 안의 중복 컴파일을
      # 없앤다. 따로 부르면 Gradle 시작 비용을 한 번 더 내지만, 같은 호출이면 방금 컴파일한 클래스를
      # 그대로 써 :bootJar 태스크 1.0초만 든다.
      - name: Run checks
        id: checks
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: ./gradlew check bootJar --no-daemon
      - name: Generate coverage report after failed checks
        if: ${{ failure() && steps.checks.conclusion == 'failure' }}
        run: ./gradlew jacocoTestReport -x test --no-daemon
      - name: Upload test and coverage reports
        if: ${{ always() && steps.scope.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-check-reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
          if-no-files-found: warn
          retention-days: 14
      # 발행 잡은 별도 러너라 이 잡의 build/를 물려받지 못한다. 거기서 Gradle을 다시 돌리면 없애려던
      # 중복이 되살아나므로 jar를 넘긴다. PR은 아래에서 같은 잡이 이미지를 빌드하니 올릴 필요가 없다.
      - name: Upload runtime jar for the publish job
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-jar
          path: build/libs/*.jar
          if-no-files-found: error
          # 잡 사이 전달용이라 보관할 이유가 없다.
          retention-days: 1
      - name: Set up Docker Buildx for PR image validation
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.docs_only != 'true' }}
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      # 위 Run checks가 만든 jar를 그대로 담는다. 레이어 캐시를 선언하지 않는 이유는 캐시할 대상이
      # 없기 때문이다 — 이미지 빌드가 Gradle을 돌리지 않으므로 남는 것은 베이스 이미지와 COPY뿐이고,
      # 설정만 남기면 죽은 설정이 되며 mode=max 내보내기는 발행 빌드에 91.4초를 되돌려 놓는다.
      - name: Validate backend container image
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.docs_only != 'true' }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          build-args: BUILD_SHA=${{ github.event.pull_request.head.sha }}

  image-publish:
    name: backend-image / publish
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      # check 잡이 만든 jar를 Dockerfile이 COPY하는 자리에 그대로 내려놓는다. 여기서 Gradle을 돌려
      # 다시 만들면 이 워크플로가 없애려는 중복 컴파일이 되살아난다.
      - name: Download the runtime jar built by the check job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-jar
          path: build/libs
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable backend image
        id: publish
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/team-pinlog/back:${{ github.sha }}
          build-args: BUILD_SHA=${{ github.sha }}
      - name: Verify published image digest
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          docker buildx imagetools inspect "ghcr.io/team-pinlog/back:${GITHUB_SHA}@${IMAGE_DIGEST}"
          echo "Published digest: $IMAGE_DIGEST"
