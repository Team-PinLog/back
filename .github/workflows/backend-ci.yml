name: backend-ci

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: backend-ci / check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # 아래 마이그레이션 불변성 검사가 base와 diff를 떠야 해서 전체 히스토리가 필요하다
          fetch-depth: 0
      # 이미 병합된 Flyway 마이그레이션의 수정을 막는다.
      # 빈 DB에 적용해보는 FlywayMigrationTests는 "내용이 바뀐" 것을 잡지 못한다
      # (바뀐 내용이 그대로 적용될 뿐이다). 그래서 이 검사가 따로 필요하다.
      # 근거: docs/development/database-conventions.md
      - name: Verify applied migrations were not modified
        if: github.event_name == 'pull_request'
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          violations=$(git diff --diff-filter=MDR --name-only "$base" HEAD \
            -- src/main/resources/db/migration \
            | grep -E '/V[0-9]+__.*\.sql$' || true)
          if [ -n "$violations" ]; then
            echo "$violations" | while read -r f; do
              echo "::error file=$f::이미 병합된 마이그레이션입니다. 수정·삭제·이름변경 대신 자기 소유 구간(백엔드 V2~V99, AI V100~V199)의 다음 번호로 새 마이그레이션을 추가하세요."
            done
            echo "적용된 마이그레이션을 바꾸면 Flyway 체크섬이 어긋나 배포가 깨집니다."
            exit 1
          fi
          echo "OK — 기존 마이그레이션 수정 없음"
      - uses: gradle/actions/wrapper-validation@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2
      - name: Run checks
        id: checks
        run: ./gradlew clean check --no-daemon
      - name: Generate coverage report after failed checks
        if: ${{ failure() && steps.checks.conclusion == 'failure' }}
        run: ./gradlew jacocoTestReport -x test --no-daemon
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-check-reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
          if-no-files-found: warn
          retention-days: 14
      - name: Set up Docker Buildx for PR image validation
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Validate backend container image
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          build-args: BUILD_SHA=${{ github.event.pull_request.head.sha }}

  image-publish:
    name: backend-image / publish
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable backend image
        id: publish
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/team-pinlog/back:${{ github.sha }}
          build-args: BUILD_SHA=${{ github.sha }}
      - name: Verify published image digest
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          docker buildx imagetools inspect "ghcr.io/team-pinlog/back:${GITHUB_SHA}@${IMAGE_DIGEST}"
          echo "Published digest: $IMAGE_DIGEST"
