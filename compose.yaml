services:
  postgres:
    # 운영 PostgreSQL과 동일 이미지로 고정한다(digest 핀, S15P11A705-46).
    # 테스트 컨테이너(PostgresContainerSupport)도 같은 태그를 쓴다.
    image: pgvector/pgvector:0.8.5-pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    labels:
      org.springframework.boot.service-connection: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pinlog}
      POSTGRES_USER: ${POSTGRES_USER:-pinlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pinlog-local}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pinlog} -d ${POSTGRES_DB:-pinlog}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    # 테스트 컨테이너(PostgresRedisContainerSupport)도 같은 태그를 쓴다.
    image: redis:7.4.5-alpine
    labels:
      org.springframework.boot.service-connection: redis
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Context→AI 요청 큐(BD-48). 테스트 컨테이너(IntegrationContainerSupport)도 같은 태그를 쓴다.
    # KRaft 단일 노드. 호스트(애플리케이션)는 HOST 리스너(19092)로, 컨테이너 내부는 9092로 붙는다 —
    # Kafka는 접속 후 advertised listener로 재접속하므로 호스트용 주소를 따로 광고해야 한다.
    image: apache/kafka:4.1.0
    labels:
      # Boot의 compose 자동 연결을 끄고 application-local.yml의 명시 주소를 쓴다. 자동 연결은
      # 9092의 매핑 포트를 기대하는데 이 구성은 호스트 리스너가 19092라 서로 어긋난다.
      org.springframework.boot.ignore: true
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "${KAFKA_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

volumes:
  postgres-data:
