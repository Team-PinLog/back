services:
  postgres:
    # pgvector 확장 포함 이미지. ai 스키마의 VECTOR(1536) 컬럼과 V1의
    # CREATE EXTENSION vector에 필요하다. 운영 이미지 교체는 infra 소관.
    image: 'pgvector/pgvector:pg16'
    environment:
      - 'POSTGRES_DB=pinlog'
      - 'POSTGRES_USER=ssafy'
      - 'POSTGRES_PASSWORD=secret'
    ports:
      # 로컬 포트 충돌을 피하려고 호스트 포트에 1을 접두한다. 컨테이너 포트는 5432 유지.
      - '15432:5432'
  redis:
    image: 'redis:latest'
    ports:
      - '6379'
